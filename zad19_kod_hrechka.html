<script type="text/javascript">
 function pole_Hre()
 {
var a_Hre= parseFloat(document.getElementById('dlugosc').value);
var b_Hre= a_Hre*a_Hre;
 document.getElementById("nazwa").innerHTML ="Pole kwadratu= "+b_Hre.toFixed(2)+" cm^2";
 }
 function obwod_Hre()
 {
var a_Hre= parseFloat(document.getElementById('dlugosc').value);
var b_Hre= 4*a_Hre;
 document.getElementById("nazwa").innerHTML ="Obwód kwadratu= "+b_Hre.toFixed(2)+" cm";
 }
</script>
 <h1>Wszystko o KWADRACIE</h1><br><br>
 Podaj długość boku: <input type="text" id="dlugosc" value=""> cm<br><br><br>
 <input type="button" name="pole" value="Oblicz pole" Onclick="pole_Hre()"><br><br>
 <input type="button" name="obwod" value="Oblicz obwod" Onclick="obwod_Hre()"><br><br>
 <div style="color:red;font-size:50px;"id="nazwa"></div>
