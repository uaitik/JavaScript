<!DOCTYPE html>
 <head>
 <title> Użycie fukcji </title>
 <meta charset="utf-8">
 </head>
<body>
 <div style="color:navy;font-size:50px;">
 <script language="JavaScript">
 var a=parseFloat(prompt("a=",""));
 var b=parseFloat(prompt("b=",""));
 function suma_hre(a, b) {
 return a + b;
 }
 function roznica_hre(a, b) {
 return a - b;
 }
 function iloczyn_hre(a, b) {
 return a * b;
 }
  function kwadrat_hre(a, b) {
 return a ** 2 + b ** 2;
 }
  function reszta_z_dzielenia_hre(a, b) {
 return a % b;
 }

 document.write("suma="+suma_hre(a,b)+"<br>");
 document.write("roznica="+roznica_hre(a,b)+"<br>");
 document.write("iloczyn="+iloczyn_hre(a,b)+"<br>");
 document.write("kwadrat="+kwadrat_hre(a,b)+"<br>");
 document.write("reszta z dzielenia="+reszta_z_dzielenia_hre(a,b)+"<br>");

</script>
</div>
</body>
