<html>
<body>
<div style="color:rgb(0, 0, 128);">
    <script language="JavaScript">
        var X_Hre = parseFloat(prompt("Podaj x1=", ""));
        var X1_Hre = parseFloat(prompt("Podaj x2=", ""));
        document.write("wczytane liczby: x1=" + X_Hre + " &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; x2=" + X1_Hre + "<br>");

var Y1_Hre = (3 * Math.pow(X_Hre, 5/7));
var rad_hre = (X_Hre * Math.PI) / 180;
var Y2_Hre = 2 * Math.cos(rad_hre) + 3 * Math.sin(rad_hre);
var Y3_Hre = Math.pow(Math.pow(X_Hre,5) + 2 * Math.pow(X1_Hre,4) * Math.abs(X_Hre - X1_Hre), 1/3);
 document.write("y1=" + Y1_Hre.toFixed(2) + "<br>");
 document.write("y2=" + Y2_Hre.toFixed(2) + "<br>");
 document.write("y3=" + Y3_Hre.toFixed(2) + "<br>");
         function okno_zamknij_milc()
         {
         window.close()
         }
    </script>
</div>
<input type="button" value="zamknij okno" onclick="okno_zamknij_milc()"/>
</body>
</html>
